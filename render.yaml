services:
  - type: web
    name: resumematch-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resumematch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: resumematch-redis
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false

  - type: worker
    name: resumematch-bot
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/run_bot.py
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resumematch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: resumematch-redis
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false

  - type: redis
    name: resumematch-redis
    ipAllowList: []

databases:
  - name: resumematch-db
    databaseName: resumematch
    user: resumematch